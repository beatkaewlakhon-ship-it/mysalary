<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>MySalary</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1D4ED8"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="MySalary"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F7FF;--cd:#fff;--bd:#DCE6FA;--tx:#0B1B3F;--mu:#51628A;--pr:#1D4ED8;--pl:#E3ECFC;--ok:#065F46;--okb:#D1FAE5;--no:#92400E;--nob:#FEF3C7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1226;--cd:#121C38;--bd:#25335C;--tx:#E8EEFF;--mu:#9DB0DD;--pr:#6D97FF;--pl:#1E2D58;--ok:#7EE7B8;--okb:#0F3B2C;--no:#FCD58A;--nob:#43300E}}
:root[data-theme="dark"]{--bg:#0A1226;--cd:#121C38;--bd:#25335C;--tx:#E8EEFF;--mu:#9DB0DD;--pr:#6D97FF;--pl:#1E2D58;--ok:#7EE7B8;--okb:#0F3B2C;--no:#FCD58A;--nob:#43300E}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px 'Noto Sans Thai',sans-serif}
#app{max-width:1000px;margin:0 auto;padding:16px 14px 96px}
h1{margin:0;font-size:22px}h2{margin:0 0 8px;font-size:15px}
.t{font-size:12px;color:var(--mu)}.b{font-weight:700}.g{color:var(--pr)}
.grid{display:grid;gap:12px;margin-top:12px}@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}.w2{grid-column:span 2}}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:14px;min-width:0}
.hero{background:var(--pr);color:#fff;border:0}.hero .t{color:#DCE6FF}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;font-size:13px}
.btn{border:0;border-radius:12px;background:var(--pr);color:#fff;font:600 14px 'Noto Sans Thai',sans-serif;min-height:44px;padding:0 14px;cursor:pointer}
.btn.s{background:var(--pl);color:var(--tx)}.btn.w{width:100%}.btn.x{min-height:36px;padding:0 10px;font-size:12px}
input,select{font:14px 'Noto Sans Thai',sans-serif;min-height:44px;border:1px solid var(--bd);border-radius:10px;padding:0 10px;width:100%;background:var(--bg);color:var(--tx)}
input[type=checkbox]{width:22px;min-height:22px}
label{display:block;font-size:12px;color:var(--mu);margin-top:8px}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;min-height:56px;font:12px 'Noto Sans Thai',sans-serif;color:var(--mu);cursor:pointer}nav .on{color:var(--pr);font-weight:700}
@media(min-width:900px){nav{top:0;right:auto;width:190px;flex-direction:column;border-top:0;border-right:1px solid var(--bd);padding-top:20px}nav button{text-align:left;padding:0 20px;font-size:14px;flex:none}#app{margin-left:210px;max-width:none;padding-right:24px}}
.bar{height:8px;border-radius:4px;background:var(--pl);overflow:hidden}.bar i{display:block;height:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px}
.cal button{border:0;border-radius:8px;min-height:40px;background:none;color:var(--tx);font:12px 'Noto Sans Thai',sans-serif;cursor:pointer}.cal .we{color:var(--mu)}.cal .h{background:#F59E0B;color:#0B1B3F;font-weight:700}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600}.ok{background:var(--okb);color:var(--ok)}.no{background:var(--nob);color:var(--no)}
.lg{display:flex;align-items:center;gap:6px;font-size:12px;padding:2px 0}.lg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.dn{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

</style></head><body><div id="app"></div><nav id="nv"></nav><div id="fl"></div>
<script>
const K='payapp1',D={base:25000,rent:2000,travel:1500,food:55,otMeal:60,otMin:1.5,cut:20,pay:25,tax:'5',pvd:5,wel:250,dil:0,sso:750,wkend:true,savePct:0,quota:{sick:30,personal:6,vac:10},hol:[],ot:{},leave:[],tx:[],slip:{},pvdM:0,pvdY:0,welM:0,welY:0,dilp:{},name:'',lun:['12:00','13:00'],brk:['17:00','17:30'],last:{s:'08:00',e:'17:00'}};
let S;try{S=Object.assign({},D,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){S=JSON.parse(JSON.stringify(D))}
const sv=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
let ME=null,PW='',LK=false,FG=false;try{PW=localStorage.getItem(K+'pw')||''}catch(e){}LK=!!PW;
const spw=()=>{try{PW?localStorage.setItem(K+'pw',PW):localStorage.removeItem(K+'pw')}catch(e){}};
async function hp(x){const t='mysalary:'+x;try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(z=>z.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of t)h=((h*33)^c.charCodeAt(0))>>>0;return'x'+h}}
const av=z=>{const n=S.name||(ME&&ME.name)||'ผู้ใช้';return S.avatar?`<img src="${S.avatar}" alt="" style="width:${z}px;height:${z}px;border-radius:50%;object-fit:cover">`:`<span style="width:${z}px;height:${z}px;border-radius:50%;background:var(--pr);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700">${esc(n[0])}</span>`};
const hd=()=>`<header style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px"><div><div style="font-size:22px;font-weight:700;color:var(--pr)">◈ MySalary</div><div class="t">Work Smarter · Live Better</div></div><div style="display:flex;gap:8px;align-items:center">${PW?'<button class="btn s x" data-a="lock">ล็อก</button>':''}<button data-a="tab" data-d="set" aria-label="โปรไฟล์" style="border:0;background:none;padding:0;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--tx);font:13px 'Noto Sans Thai',sans-serif">${esc(S.name||(ME&&ME.name)||'')}${av(40)}</button></div></header>`;
const $=s=>document.querySelector(s),p=n=>String(n).padStart(2,'0'),f=d=>d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()),pd=s=>{const[a,b,c]=s.split('-');return new Date(+a,b-1,+c)},fm=n=>(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),fi=n=>Math.round(n).toLocaleString('en-US'),r2=n=>Math.round((n+Number.EPSILON)*100)/100,dim=(y,m)=>new Date(y,m+1,0).getDate();
const TM=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'],fd=s=>{const d=pd(s);return d.getDate()+' '+TM[d.getMonth()]},esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const C=['#1D4ED8','#0EA5E9','#6366F1','#14B8A6','#F59E0B','#F43F5E'],today=new Date();
let T='home',v=(d=>({y:d.getFullYear(),m:d.getMonth()}))(new Date(today.getFullYear(),today.getMonth()+(today.getDate()>S.cut?1:0),1)),cm={y:today.getFullYear(),m:today.getMonth()};
const isH=d=>S.hol.includes(f(d))||(S.wkend&&(d.getDay()==0||d.getDay()==6));
const tm=x=>{const[a,b]=x.split(':');return +a*60+ +b},hrs=(o,h)=>{const a=tm(o.s);let b=tm(o.e);if(b<=a)b+=1440;let m=b-a;if(h)for(const z of[S.lun,S.brk]){const c=tm(z[0]),d=tm(z[1]);m-=Math.max(0,Math.min(b,d)-Math.max(a,c))}return Math.max(0,m)/60};
function per(y,m){const e=new Date(y,m,Math.min(S.cut,dim(y,m))),q=new Date(y,m-1,1);return[new Date(q.getFullYear(),q.getMonth(),Math.min(S.cut,dim(q.getFullYear(),q.getMonth()))+1),e]}
const fs=(M,Y)=>M>0&&Y>0?(Y>2400?Y-543:Y)*12+M-1:null,on=(M,Y,y,m)=>{const q=fs(M,Y);return q!=null&&y*12+m>=q},fu=(M,Y,amt,y,m)=>{const q=fs(M,Y);if(q==null)return{t:'ยังไม่ได้ตั้งเดือนที่สมัคร',v:0};const n=Math.max(0,y*12+m-q+1);return{t:'สมัครตั้งแต่ '+TM[M-1]+' '+(Y>2400?Y:Y+543)+' · สะสม '+n+' เดือน',v:r2(amt*n)}};
function calc(y,m){const dl=+(S.dilp[y+'-'+m]??S.dil)||0;const[s,e]=per(y,m),H=S.base/240;let wd=0,hw=0,pay=0,h15=0,h20=0,h30=0,otm=0,rows=[];
for(let d=new Date(s);d<=e;d.setDate(d.getDate()+1)){const k=f(d),lv=S.leave.some(l=>l.d==k),h=isH(d),o=S.ot[k];if(!h&&!lv)wd++;
if(o){const hr=hrs(o,h);let pp,x=0;if(h){const a=Math.min(hr,8);x=Math.max(0,hr-8);pp=r2(H*(a*1+x*3));h20+=a;h30+=x;hw++}else{pp=r2(H*hr*1.5);h15+=hr}const q=h?x:hr,ml=q>=S.otMin&&q>0;pay+=pp;if(ml)otm++;rows.push({k,hr,r:h?(x?'×1.0 + ×3.0':'×1.0'):'×1.5',pp,ml,h})}}
const food=(wd+hw)*S.food,om=otm*S.otMeal,g=r2(S.base+S.rent+S.travel+dl+food+pay+om),tax=r2(Math.max(0,(g-S.sso-(S.base+S.rent-S.sso))*(parseFloat(S.tax)||0)/100)),pvd=on(S.pvdM,S.pvdY,y,m)?r2(S.base*S.pvd/100):0,wel=on(S.welM,S.welY,y,m)?S.wel:0,ded=r2(S.sso+tax+pvd+wel);
return{s,e,wd,hw,pay,h15,h20,h30,otm,rows,food,om,g,tax,pvd,ded,net:r2(g-ded),dl,wel}}
function donut(sg,c1,c2){const t=sg.reduce((a,x)=>a+x[1],0)||1;let ac=0,s='';for(const[n,x,c]of sg){const L=x/t*251.3;s+=`<circle cx="60" cy="60" r="40" fill="none" stroke="${c}" stroke-width="18" stroke-dasharray="${L.toFixed(1)} ${(251.3-L).toFixed(1)}" stroke-dashoffset="${(-ac).toFixed(1)}" transform="rotate(-90 60 60)"/>`;ac+=L}
return`<div class="dn"><svg viewBox="0 0 120 120" width="140" height="140" role="img" aria-label="กราฟวงกลม">${s}<text x="60" y="58" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">${c1}</text><text x="60" y="72" text-anchor="middle" font-size="8" fill="currentColor" opacity=".7">${c2}</text></svg><div>${sg.map(([n,x,c])=>`<div class="lg"><i style="background:${c}"></i>${n} ${Math.round(x/t*100)}%</div>`).join('')}</div></div>`}
function bars(vs,ls,w=360,h=140){const m=Math.max(...vs,1),bw=w/vs.length;return`<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="กราฟแท่ง">${vs.map((x,i)=>{const bh=x/m*(h-40),X=i*bw+bw*.15;return`<rect x="${X}" y="${h-22-bh}" width="${bw*.7}" height="${bh}" rx="5" fill="${C[i%6]}"/><text x="${X+bw*.35}" y="${h-8}" text-anchor="middle" font-size="10" fill="currentColor" opacity=".7">${ls[i]}</text><text x="${X+bw*.35}" y="${h-26-bh}" text-anchor="middle" font-size="9" fill="currentColor">${fi(x)}</text>`}).join('')}</svg>`}
const card=(t,i,c='')=>`<div class="c ${c}"><h2>${t}</h2>${i}</div>`,rw=(a,b,c='')=>`<div class="r"><span>${a}</span><span class="b ${c}">${b}</span></div>`;
const ymf=(l,mk,yk)=>`<label>${l}</label><div class="row"><select data-k="${mk}"><option value="0">เดือน</option>${TM.map((x,i)=>`<option value="${i+1}"${S[mk]==i+1?' selected':''}>${x}</option>`).join('')}</select><input data-k="${yk}" type="number" placeholder="ปี พ.ศ. เช่น 2569" value="${S[yk]||''}"></div>`;
const inp=(l,k,val,ty='number',st='')=>`<label>${l}<input data-k="${k}" type="${ty}" ${st} step="any" value="${val}"></label>`;
const pl=()=>`<div class="row" style="align-items:center;margin-bottom:8px"><button class="btn s x" data-a="pv" data-d="-1">ก่อนหน้า</button><div class="b" style="text-align:center;flex:2">${(()=>{const[s,e]=per(v.y,v.m);return fd(f(s))+' – '+fd(f(e))+' '+(e.getFullYear()+543)})()}</div><button class="btn s x" data-a="pv" data-d="1">ถัดไป</button></div>`;
function home(){const c=calc(v.y,v.m),key=v.y+'-'+v.m,sl=S.slip[key],hv=[],hl=[];for(let i=5;i>=0;i--){const d=new Date(v.y,v.m-i,1);hv.push(calc(d.getFullYear(),d.getMonth()).net);hl.push(TM[d.getMonth()])}
const mo=v.m+1;
return pl()+`<div class="c hero"><div class="t">เงินเดือนสุทธิ (ประมาณการ) · จ่ายวันที่ ${S.pay}</div><div style="font-size:38px;font-weight:700">฿${fm(c.net)}</div><div class="t" style="margin-bottom:10px">รายได้ ${fm(c.g)} − รายการหัก ${fm(c.ded)}</div><button class="btn s w" data-a="push">ส่งเข้ารายรับ-รายจ่าย${S.savePct?' และเงินออม':''}</button></div><div class="grid">`+
card('สัดส่วนรายได้',donut([['ฐานเงินเดือน',S.base,C[0]],['ค่าเช่าบ้าน',S.rent,C[1]],['ค่าเดินทาง',S.travel,C[2]],['เบี้ยขยัน',c.dl,'#8B5CF6'],['ค่าอาหาร',c.food,C[3]],['OT',c.pay,C[4]],['ค่าอาหาร OT',c.om,C[5]]],'฿'+fi(c.g),'รายได้รวม'))+
card('เงินเดือนสุทธิ 6 รอบล่าสุด',bars(hv,hl))+
card('รายได้',rw('ฐานเงินเดือน',fm(S.base))+rw('ค่าเช่าบ้าน',fm(S.rent))+rw('ค่าเดินทาง',fm(S.travel))+rw('เบี้ยขยัน',fm(c.dl))+rw(`ค่าอาหาร (${c.wd+c.hw} วัน)`,fm(c.food))+rw('OT (คิดจากฐานเท่านั้น)',fm(c.pay))+rw(`ค่าอาหาร OT (${c.otm} วัน)`,fm(c.om)))+
card('เบี้ยขยันรอบนี้',inp('จำนวนเงิน (บาท) · กรอกตามที่บริษัทจ่ายจริง','dilp.'+key,S.dilp[key]??'','number','placeholder="'+S.dil+'"')+'<div class="t">เว้นว่างไว้ = ใช้ค่าตั้งต้นจากหน้าตั้งค่า</div>')+card('รายการหัก',rw('ประกันสังคม',fm(S.sso))+rw('ภาษีรายเดือน',fm(c.tax))+rw(`กองทุนสำรองเลี้ยงชีพ ${S.pvd}%`,fm(c.pvd))+rw('กองทุนสงเคราะห์ลูกจ้าง',fm(c.wel)))+
(()=>{const p=fu(S.pvdM,S.pvdY,r2(S.base*S.pvd/100),v.y,v.m),w=fu(S.welM,S.welY,S.wel,v.y,v.m);return card('เงินกองทุนสะสมตั้งแต่สมัคร (ถึงรอบนี้)',rw('สำรองเลี้ยงชีพ','฿'+fm(p.v),'g')+'<div class="t">'+p.t+'</div>'+rw('กองทุนสงเคราะห์','฿'+fm(w.v),'g')+'<div class="t">'+w.t+'</div><div class="t">ยังไม่รวมส่วนที่บริษัทสมทบ</div>')})()+
card('เทียบกับสลิปเงินเดือน',inp('ยอดสุทธิในสลิปจริง','slip.'+key,sl??'')+(sl?'<div class="r"><span>ผลต่าง</span>'+(Math.abs(sl-c.net)<0.01?'<span class="pill ok">ตรงกัน</span>':`<span class="pill no">ต่าง ${fm(sl-c.net)} บาท</span>`)+'</div>':''))+'</div>'}
function ot(){const c=calc(v.y,v.m),wk=[0,0,0,0,0];c.rows.forEach(r=>{wk[Math.min(4,Math.floor((pd(r.k)-c.s)/864e5/7))]+=r.hr});
return pl()+`<div class="grid"><div class="c"><h2>บันทึก OT</h2><div class="t">กรอกได้ทุกวัน เก็บไว้ตรวจกับสลิป อัตรา OT คำนวณอัตโนมัติตามปฏิทินวันหยุด</div>${'<label>วันที่<input id="od" type="date" value="'+f(today)+'"></label>'}<div class="row"><label>เริ่ม<input id="os" type="time" value="${S.last.s}"></label><label>สิ้นสุด<input id="oe" type="time" value="${S.last.e}"></label></div><div class="t" style="margin-top:6px">วันปกติ: กรอกเวลา OT (คิด ×1.5) · วันหยุด: กรอกเวลาเริ่มงาน-เลิกงาน ระบบหักเวลาพักให้เอง แล้วคิด ×1.0 ใน 8 ชม.แรก และ ×3.0 ส่วนที่เกิน</div><button class="btn w" style="margin-top:10px" data-a="addot">บันทึก OT</button></div>`+
card('สรุปรอบนี้',rw('OT ×1.5',c.h15.toFixed(1)+' ชม.')+rw('OT วันหยุด ×1.0 (ไม่เกิน 8 ชม.)',c.h20.toFixed(1)+' ชม.')+rw('OT วันหยุด ×3.0 (ส่วนเกิน 8 ชม.)',c.h30.toFixed(1)+' ชม.')+rw('ค่า OT รวม','฿'+fm(c.pay),'g')+rw('ค่าอาหาร OT รวม','฿'+fm(c.om),'g'))+
card('ชั่วโมง OT แยกอัตรา',donut([['×1.5',c.h15,C[0]],['×1.0 วันหยุด',c.h20,C[4]],['×3.0',c.h30,C[5]]],(c.h15+c.h20+c.h30).toFixed(1),'ชั่วโมง'))+
card('ชั่วโมง OT รายสัปดาห์',bars(wk.map(x=>+x.toFixed(1)),['สป.1','สป.2','สป.3','สป.4','สป.5']))+
card('รายการ OT',c.rows.length?c.rows.map(r=>`<div class="r"><span>${fd(r.k)} ${S.ot[r.k].s}–${S.ot[r.k].e} (${r.hr.toFixed(1)} ชม.) ${r.r}<br>${r.h?'<span class="pill ok">ได้ค่าอาหารวันปกติ</span> ':''}${r.ml?'<span class="pill ok">ได้ค่าอาหาร OT</span>':'<span class="pill no">ไม่ได้ค่าอาหาร OT</span>'}</span><span><b>฿${fm(r.pp)}</b> <button class="btn s x" data-a="delot" data-d="${r.k}">ลบ</button></span></div>`).join(''):'<div class="t">ยังไม่มีรายการในรอบนี้</div>','w2')+'</div>'}
const LT={sick:'ลาป่วย',personal:'ลากิจ',vac:'ลาพักร้อน'};
